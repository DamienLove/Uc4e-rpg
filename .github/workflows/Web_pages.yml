name: Web (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'

      - name: Get packages
        working-directory: universe_connected
        run: flutter pub get

      # Build the Flutter web app for GitHub Pages
      - name: Build Flutter Web
        working-directory: universe_connected
        run: flutter build web --release --web-renderer html --base-href /Uc4e-rpg/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: universe_connected/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
