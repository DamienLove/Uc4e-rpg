name: Android Release (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Ensure valid Flutter Android structure
        shell: bash
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "⚙️  No Android folder detected. Recreating valid Flutter app structure..."
            TMPDIR=$(mktemp -d)
            flutter create -t app "$TMPDIR/app"
            mv "$TMPDIR/app/android" ./android
            mv "$TMPDIR/app/ios" ./ios
            rm -rf "$TMPDIR"
          else
            echo "✅ Existing Android folder found."
          fi

      - name: Ensure compileSdk level 35
        shell: bash
        run: |
          FILE="android/app/build.gradle"
          if [[ -f "$FILE" ]]; then
            sed -i "s/compileSdk.*/compileSdk = 35/" "$FILE" || true
          fi

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uc4e-apk
          path: build/app/outputs/flutter-apk/app-release.apk
