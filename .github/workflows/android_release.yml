name: Android Release (Legacy Flame)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Ensure Android folder exists
        shell: bash
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "Creating Android folder..."
            flutter create .
          fi
          sed -i 's/compileSdk.*/compileSdk = 33/' android/app/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uc4e-legacy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
